<section id="players" class="players-section">

    <div class="section-title">
        <span>🇮🇳</span>
        <h2>India Women Players</h2>
        <p>Player performance statistics</p>
    </div>

    <div class="table-container">

        <table class="player-table">

            <thead>
                <tr>
                    <th>Player</th>
                    <th>Format</th>
                    <th>Matches</th>
                    <th>Runs</th>
                    <th>Wickets</th>
                    <th>Average</th>
                    <th>Strike Rate</th>
                </tr>
            </thead>

            <tbody id="playerTableBody">
                <!-- JavaScript data will appear here -->
            </tbody>

        </table>

    </div>

</section>
<section class="statistics-section">

    <div class="stat-card">
        <div class="stat-icon">🏏</div>
        <h3 id="totalMatches">0</h3>
        <p>Matches</p>
    </div>

    <div class="stat-card">
        <div class="stat-icon">📊</div>
        <h3 id="totalRuns">0</h3>
        <p>Runs</p>
    </div>

    <div class="stat-card">
        <div class="stat-icon">🎯</div>
        <h3 id="totalWickets">0</h3>
        <p>Wickets</p>
    </div>

</section>
